name: boardpocket
description: "BoardPocket - Digital Collection & Randomizer for Board Games"
publish_to: 'none'

version: 0.1.4+11

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  # cupertino_icons 2.0 requires Dart ^3.12; newest 1.x for this SDK.
  cupertino_icons: ^1.0.9
  # google_fonts 9 requires Dart ^3.13; newest 8.x for this SDK.
  google_fonts: ^8.2.1

  # Database
  # sqflite 2.4.3+ requires Dart >=3.12; newest 2.4.2 line for this SDK.
  sqflite: ^2.4.2
  # sqflite_common_ffi_web 1.2 requires Dart >=3.12; newest 1.1.x for this SDK.
  sqflite_common_ffi_web: ^1.1.1
  path: ^1.9.1

  # Storage & Files
  path_provider: ^2.1.6
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  share_plus: ^13.3.1

  # Navigation
  # go_router 18 requires Dart >=3.12; pinned to the newest 17.x for this SDK.
  go_router: ^17.5.0

  # State Management
  provider: ^6.1.5

  # Utils
  http: ^1.6.0
  # intl is pinned to 0.20.2 by flutter_localizations in this SDK.
  intl: ^0.20.2
  uuid: ^4.6.0
  collection: ^1.19.1
  shared_preferences: ^2.5.6
  device_info_plus: ^13.3.0
  url_launcher: ^6.3.3

  # Charts
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  coverage: ^1.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/ic_launcher.png"
  adaptive_icon_background: "#FFFFFF"
  #adaptive_icon_foreground: "assets/icon/ic_launcher_foreground.png"
  min_sdk_android: 21
