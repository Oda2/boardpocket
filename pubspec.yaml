name: boardpocket
description: "BoardPocket - Digital Collection & Randomizer for Board Games"
publish_to: 'none'

version: 0.1.5+12

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^2.0.0
  google_fonts: ^9.0.0

  # Database
  sqflite: ^2.4.4
  sqflite_common_ffi_web: ^1.2.0
  path: ^1.9.1

  # Storage & Files
  path_provider: ^2.1.6
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  share_plus: ^13.3.1

  # Navigation
  go_router: ^18.0.2

  # State Management
  provider: ^6.1.5

  # Utils
  http: ^1.6.0
  intl: ^0.20.3
  uuid: ^4.6.0
  collection: ^1.19.1
  shared_preferences: ^2.5.6
  device_info_plus: ^13.3.0
  url_launcher: ^6.3.3

  # Charts
  fl_chart: ^1.2.0
  lottie: ^3.6.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  coverage: ^1.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/lottie/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/ic_launcher.png"
  adaptive_icon_background: "#FFFFFF"
  #adaptive_icon_foreground: "assets/icon/ic_launcher_foreground.png"
  min_sdk_android: 21
