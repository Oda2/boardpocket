name: Release

# Tag a release (git push origin v1.2.3) to:
#   1. publish the web build to GitHub Pages
#   2. attach a signed APK and an App Bundle to the GitHub Release for that tag
on:
  push:
    tags:
      # Accepts both `v1.2.3` and the bare `1.2.3` style this repo already used
      # for 0.0.1 - 0.0.4.
      - 'v[0-9]*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.2.3)'
        required: true
        type: string
      allow_unsigned:
        description: >-
          Allow building without the signing secrets (NOT distributable).
          Produces an APK that cannot update an existing install.
        required: false
        default: false
        type: boolean

permissions:
  contents: write # push the gh-pages branch and create the GitHub Release

# Never let two releases race for the Pages deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.7'
  KEYSTORE_PATH: android/app/boardpocket.keystore

jobs:
  # ---------------------------------------------------------------------------
  # Android: APK + App Bundle
  # ---------------------------------------------------------------------------
  android:
    name: Android artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            .packages
            pubspec.lock
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Download dependencies
        run: flutter pub get

      # The same keystore must be used for every release. If it changes,
      # Android refuses to update an existing install, and the user has to
      # uninstall first - which deletes their local collection, because
      # BoardPocket keeps its data on the device with no server to restore
      # from. That is why this step fails hard instead of silently generating
      # a throwaway key.
      - name: Configure signing keystore
        id: signing
        env:
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned || false }}
          # Accept both the short and the ANDROID_-prefixed names, so the
          # secrets work whichever convention was used when they were added.
          # A missing secret evaluates to an empty string, so the fallback is
          # safe.
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS_VALUE: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD_VALUE: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          STORE_PASSWORD_VALUE: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_B64}" ]; then
            if [ "${ALLOW_UNSIGNED}" != "true" ]; then
              echo "::error::No keystore secret configured. Add one of ANDROID_KEYSTORE_BASE64 / KEYSTORE_BASE64 (Settings > Secrets and variables > Actions), or re-run manually with allow_unsigned=true for a throwaway build."
              exit 1
            fi
            echo "::warning::Building with a throwaway CI keystore. The resulting APK CANNOT update an existing install and must not be distributed."
            keytool -genkeypair -v \
              -keystore "${KEYSTORE_PATH}" \
              -alias boardpocket \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass boardpocket -keypass boardpocket \
              -dname "CN=BoardPocket, OU=BoardPocket, O=BoardPocket, L=, S=, C=US"
          else
            echo "${KEYSTORE_B64}" | base64 --decode > "${KEYSTORE_PATH}"
            echo "Using the configured release keystore."
          fi

          # android/app/build.gradle.kts reads rootProject.file("../.env"),
          # and rootProject is android/, so the file must sit at the REPO ROOT
          # (android/../.env) - not in android/.
          # BOARD_STORE_FILE, on the other hand, goes through file() inside
          # android/app/, so the keystore must live there.
          cat > .env <<EOF
          BOARD_KEY_ALIAS=${KEY_ALIAS_VALUE:-boardpocket}
          BOARD_KEY_PASSWORD=${KEY_PASSWORD_VALUE:-boardpocket}
          BOARD_STORE_FILE=boardpocket.keystore
          BOARD_STORE_PASSWORD=${STORE_PASSWORD_VALUE:-boardpocket}
          EOF

          if ! grep -q .env .gitignore; then
            echo "::warning::.env is not git-ignored; refusing to continue."
            exit 1
          fi

      - name: Resolve version from pubspec
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          NAME=$(grep -E '^name:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Collect artifacts
        id: collect
        env:
          SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' || secrets.KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          NAME="${{ steps.version.outputs.name }}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$SIGNED" = "true" ]; then
            SUFFIX="release"
          else
            SUFFIX="UNSIGNED-do-not-distribute"
          fi
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
             "release-artifacts/${NAME}-${VERSION}-${SUFFIX}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "release-artifacts/${NAME}-${VERSION}-${SUFFIX}.aab"

      - uses: actions/upload-artifact@v6
        with:
          name: android-artifacts
          path: release-artifacts
          retention-days: 90
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Web: compiled bundle for GitHub Pages
  # ---------------------------------------------------------------------------
  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            .packages
            pubspec.lock
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Download dependencies
        run: flutter pub get

      - name: Resolve base href
        id: base
        run: |
          set -euo pipefail
          # Project pages are served from /<repo>/, so assets need that prefix.
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "href=/${REPO}/" >> "$GITHUB_OUTPUT"

      - name: Build web
        run: |
          flutter build web --release \
            --base-href "${{ steps.base.outputs.href }}"

      # The app uses hash routing, so this is only a safety net for deep links.
      - name: Add Pages fallback
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-artifact@v6
        with:
          name: web-site
          path: build/web
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Deploy the web bundle to GitHub Pages
  #
  # This pushes the build to the `gh-pages` branch, which is what "Deploy from
  # a branch" serves. It needs no repository setting, unlike
  # actions/deploy-pages (that one only works when Pages source is set to
  # "GitHub Actions" and otherwise fails with "Get Pages site failed").
  # ---------------------------------------------------------------------------
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download the built site
        uses: actions/download-artifact@v6
        with:
          name: web-site
          path: site

      - name: Replace site content
        run: |
          set -euo pipefail
          # Wipe the previous deployment, keeping the .git directory so we can
          # commit from here.
          find gh-pages -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r site/. gh-pages/
          test -f gh-pages/index.html || { echo "::error::index.html missing from the build"; exit 1; }
          echo "Files published: $(find gh-pages -type f -not -path '*/.git/*' | wc -l)"

      - name: Commit and push
        run: |
          set -euo pipefail
          cd gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Deploy ${{ github.ref_name }} to GitHub Pages"
          git push origin HEAD:gh-pages

  # ---------------------------------------------------------------------------
  # Attach the Android artifacts to the release for this tag
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: android
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v6
        with:
          name: android-artifacts
          path: release-artifacts

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd release-artifacts
          shopt -s nullglob
          files=(*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No artifacts were downloaded."
            exit 1
          fi

          cat > notes.md <<'EOF'
          ## Installing

          - **`.apk`** — install directly on an Android device. You will need
            to allow installs from your browser/file manager the first time.
          - **`.aab`** — the bundle format used for Play Store uploads.

          ## About the web version

          The same build is published to GitHub Pages on every release.
          EOF

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; replacing its assets."
            gh release upload "${TAG}" "${files[@]}" --clobber
            gh release edit "${TAG}" --notes-file notes.md
          else
            gh release create "${TAG}" "${files[@]}" \
              --title "${TAG}" \
              --notes-file notes.md \
              --verify-tag \
              --generate-notes
          fi
